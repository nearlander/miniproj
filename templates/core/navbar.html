{% load static %}
<nav class="bg-gray-900 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center py-4">

            <div class="flex items-center">
                <a href="{% url 'home' %}" class="flex-shrink-0 flex items-center">
                    <svg class="h-8 w-auto text-indigo-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.623 0-1.31-.21-2.571-.602-3.751A11.959 11.959 0 0115 2.714m-6 0A11.959 11.959 0 006 3.598a11.99 11.99 0 00-2.398 1.05C2.8 5.438 2.25 6.217 2.25 7.051c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.623 0-.834-.55-1.613-1.348-2.398A11.99 11.99 0 0018 3.598a11.959 11.959 0 00-3- .884m-6 0l-3 1.5m3-1.5l3 1.5m-3-1.5V5.25m3 0V5.25m-3 0V2.714m0 0l3 1.5m0-1.5l-3 1.5" />
                    </svg>
                    <span class="font-semibold text-xl text-white ml-2">Secure Web Banking</span>
                </a>
            </div>

            <div class="hidden sm:ml-6 sm:flex sm:space-x-4">
                {% if request.user.is_authenticated %}
                    <a href="{% url 'transactions:transaction_report' %}" class="px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:text-white hover:bg-gray-700">
                        Transaction Report
                    </a>
                    <a href="{% url 'transactions:deposit_money' %}" class="px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:text-white hover:bg-gray-700">
                        Deposit
                    </a>
                    <a href="{% url 'transactions:withdraw_money' %}" class="px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:text-white hover:bg-gray-700">
                        Withdraw
                    </a>
                {% endif %}
            </div>

            <div class="hidden sm:ml-6 sm:flex sm:items-center space-x-4">
                {% if request.user.is_authenticated %}
                    <span class="text-sm font-medium text-gray-300">
                        Welcome, {{ request.user.first_name|default:request.user.username }}
                    </span>
                    <a href="{% url 'accounts:user_logout' %}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Logout
                    </a>
                {% else %}
                    <a href="{% url 'accounts:user_login' %}" class="px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:text-white hover:bg-gray-700">
                        Login
                    </a>
                    <a href="{% url 'accounts:user_registration' %}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Register
                    </a>
                {% endif %}
            </div>

            <div class="-mr-2 flex items-center sm:hidden">
                <button class="flex items-center px-3 py-2 border rounded text-gray-400 border-gray-500 hover:text-white hover:border-white">
                    <svg class="fill-current h-3 w-3" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><title>Menu</title><path d="M0 3h20v2H0V3zm0 6h20v2H0V9zm0 6h20v2H0v-2z"/></svg>
                </button>
            </div>

        </div>
    </div>
</nav>
